<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Your account · Owner Vacation Rentals</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site_style.css?v=59">
<style>
  .account_grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:860px}
  .account_card{background:var(--sand);border-radius:var(--radius);padding:28px}
  .account_card h3{margin-bottom:14px}
  .account_card label{display:block;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink_3);margin:12px 0 6px}
  .account_card input{width:100%;font:inherit;font-size:15px;padding:12px 14px;border-radius:var(--radius_sm);border:1px solid var(--line);background:var(--page);color:var(--ink)}
  .account_card input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .account_card .btn{margin-top:18px}
  .account_msg{font-size:14px;margin-top:12px;min-height:20px}
  .account_msg.err{color:#B3261E}.account_msg.ok{color:#137333}
  .account_small{font-size:13px;color:var(--ink_3);margin-top:14px}
  .account_small a{cursor:pointer}
  .demo_badge{display:inline-block;background:var(--tile_b);color:var(--tile_b_ink);border-radius:var(--pill);padding:4px 12px;font-size:12px;font-weight:600;margin-left:10px;vertical-align:middle}
  @media (max-width:720px){.account_grid{grid-template-columns:1fr}}
  /* login page: login box first, Create Account folded under it */
  .account_stack{max-width:418px;display:flex;flex-direction:column;gap:14px}
  .account_create{padding:0}
  .account_create summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;padding:16px 22px;font-weight:600;font-size:16px}
  .account_create summary::-webkit-details-marker{display:none}
  .account_create summary::before{content:"+";flex:none;width:26px;height:26px;border-radius:50%;background:var(--page);color:var(--accent);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
  .account_create[open] summary::before{content:"–";background:var(--accent);color:var(--on_accent)}
  .account_create summary .account_small{margin-left:auto;font-weight:400}
  .account_create form{padding:0 22px 22px}
  .account_create summary > span:first-child{white-space:nowrap}
  .account_create summary .account_small{text-align:right}
  .account_delete{margin:14px 0 0;font-size:12px;color:var(--muted)}
  .account_delete a{color:inherit;text-decoration:none;opacity:.75}
  .account_delete a:hover,.account_delete a:focus{text-decoration:underline;opacity:1}
</style>
</head>
<body>
<header class="site_header">
  <div class="wrap">
    <a class="site_logo" href="index.html" data-block="site_logo"></a>
        <div class="site_switches">
      <div class="site_lang" data-block="site_prop" data-prefix="index.html"></div>
      <div class="site_lang" data-block="site_lang"></div>
  <nav class="site_nav" id="site_nav" data-block="site_nav" data-prefix="index.html"></nav>
      <label class="site_theme site_theme_head" data-block="site_theme"></label>
      <a class="site_account" data-block="site_account" href="register.html"></a>
    </div>
    <a class="btn btn_primary" href="index.html#rates" data-t="site.nav_cta"></a>
  </div>
</header>

<section id="account">
  <div class="wrap">
    <div class="kicker" data-t="site.account.kicker"></div>
    <h2><span data-t="site.account.title"></span><span class="demo_badge">Demo</span></h2>
    <p class="lead" style="margin:14px 0 28px" data-t="site.account.lead"></p>

    <div class="account_stack" id="account_forms">
      <form class="account_card" id="signin_form" novalidate>
        <h3 data-t="site.account.signin_title"></h3>
        <label for="signin_email" data-t="site.account.email"></label><input id="signin_email" name="email" type="email" autocomplete="email" required>
        <label for="signin_password" data-t="site.account.password"></label><input id="signin_password" name="password" type="password" autocomplete="current-password" required>
        <button class="btn btn_primary" type="submit" data-t="site.account.signin_btn"></button>
        <div class="account_msg" id="signin_msg"></div>
      </form>
      <details class="account_card account_create" id="signup_box">
        <summary><span data-t="site.account.signup_title"></span><span class="account_small" data-t="site.account.switch_up"></span></summary>
        <form id="signup_form" novalidate>
          <label for="signup_name" data-t="site.account.name"></label><input id="signup_name" name="name" autocomplete="name" required>
          <label for="signup_email" data-t="site.account.email"></label><input id="signup_email" name="email" type="email" autocomplete="email" required>
          <label for="signup_password" data-t="site.account.password"></label><input id="signup_password" name="password" type="password" autocomplete="new-password" minlength="8" required>
          <div class="account_small" data-t="site.account.password_hint"></div>
          <div class="account_small" data-t="site.account.consent"></div>
          <button class="btn btn_primary" type="submit" data-t="site.account.signup_btn"></button>
          <div class="account_msg" id="signup_msg"></div>
        </form>
      </details>
    </div>

    <div class="account_card" id="account_me" hidden style="max-width:418px">
      <h3 id="me_hello"></h3>
      <div class="muted" id="me_email"></div>
      <div class="account_small" id="me_since"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn_ghost" id="me_signout" data-t="site.account.signout_btn"></button>
      </div>
      <div class="account_msg" id="me_msg"></div>
      <p class="account_delete"><a id="me_delete" href="#" data-t="site.account.delete_link"></a></p>
    </div>
  </div>
</section>

<footer class="site_footer" id="site_footer">
  <div class="wrap">
    <div class="footer_row">
      <a class="site_logo" href="index.html" data-block="site_logo"></a>
      <nav class="footer_links" data-block="footer_links" data-prefix="index.html"></nav>
      <label class="site_theme" data-block="site_theme"></label>
    </div>
    <p class="footer_tagline" data-t="site.footer.tagline"></p>
    <div class="footer_legal"><b data-t="site.footer.legal_lead"></b> <span data-t="site.footer.legal"></span> © <span id="footer_year"></span> <span data-t="site.footer.copyright"></span></div>
  </div>
</footer>
<script src="data/site_text.js?v=59"></script>
<script src="data/site_text_es.js?v=59"></script>
<script src="data/properties.js?v=59"></script>
<script src="data/properties_es.js?v=59"></script>
<script src="js/csv.js?v=59"></script>
<script src="js/site_store.js?v=59"></script>
<script src="js/site_app.js?v=59"></script>
<script>
(function () {
  var S = window.SDO_STORE, T = (window.SDO_TEXT || window.SDO_SITE).account;
  var $ = function (s) { return document.querySelector(s); };
  var fmt = function (str, v) { return String(str).replace(/\{(\w+)\}/g, function (m, k) { return v[k] != null ? v[k] : m; }); };
  function show() {
    var u = S.current();
    $("#account_forms").hidden = !!u; $("#account_me").hidden = !u;
    if (u) {
      $("#me_hello").textContent = fmt(T.hello, { user: u.name });
      $("#me_email").textContent = u.email;
      deleteLink(u);
      $("#me_since").textContent = fmt(T.since, { date: new Date(u.created).toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" }) });
    }
  }
  /* after login or sign-up, land on the home page */
  function home() { location.href = "index.html"; }
  function msg(id, cls, text) { var m = $(id); m.className = "account_msg " + cls; m.textContent = window.SDO_tr ? window.SDO_tr(text) : text; }
  $("#signup_form").addEventListener("submit", async function (e) {
    e.preventDefault(); var f = e.target.elements;
    var r = await S.register(f.name.value, f.email.value, f.password.value);
    if (!r.ok) { msg("#signup_msg", "err", r.error); return; }
    home();
  });
  $("#signin_form").addEventListener("submit", async function (e) {
    e.preventDefault(); var f = e.target.elements;
    var r = await S.signIn(f.email.value, f.password.value);
    if (!r.ok) { msg("#signin_msg", "err", r.error); return; }
    home();
  });
  $("#me_signout").addEventListener("click", function () { S.signOut(); show(); });
  /* account deletion is a request to the owner by email, never a one-click action */
  function deleteLink(u) {
    var owner = (window.SDO_PROPERTIES && window.SDO_PROPERTIES[0] && window.SDO_PROPERTIES[0].contact.email) || "";
    var v = { user: u.name, email: u.email };
    $("#me_delete").href = "mailto:" + owner + "?subject=" + encodeURIComponent(fmt(T.delete_subject, v)) + "&body=" + encodeURIComponent(fmt(T.delete_body, v));
  }
  show();
})();
</script>
</body>
</html>
