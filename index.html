<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SunDestin #203 · Breathtaking beachfront views from your private balcony · Destin, FL</title>
<meta name="description" content="2nd-floor beachfront condo at Sun Destin Beach Resort, Destin FL. Private balcony over the pool, sleeps 6, direct beach access. Book direct with the owner, no platform fee.">
<link rel="canonical" href="https://sundestinonline.com/">
<meta property="og:type" content="website">
<meta property="og:title" content="SunDestin #203 · Step onto the beach. Watch kids in sight. No platform fee.">
<meta property="og:description" content="Beachfront condo in Destin, FL. Sleeps 6, beachside pool, 1 minute to the sand. Book direct with the owner.">
<meta property="og:image" content="https://sundestinonline.com/images/kitchen_wide.jpg">
<meta property="og:url" content="https://sundestinonline.com/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="">
<link rel="stylesheet" href="css/site_style.css?v=49">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%230FA3A3'/%3E%3Cpath d='M6 20c3-2 5-2 8 0s5 2 8 0 3-2 4-1' stroke='%23fff' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='10' r='3.5' fill='%23fff'/%3E%3C/svg%3E">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "VacationRental",
  "name": "SunDestin #203",
  "description": "2nd-floor beachfront condo at Sun Destin Beach Resort with a private balcony over the beachside pool. 1 bedroom, 1 bath, sleeps 6.",
  "url": "https://sundestinonline.com/",
  "image": ["https://sundestinonline.com/images/kitchen_wide.jpg", "https://sundestinonline.com/images/balcony_over_pool.jpg", "https://sundestinonline.com/images/living_slider_gulf.jpg"],
  "address": {"@type": "PostalAddress", "streetAddress": "1040 Highway 98 East, #203", "addressLocality": "Destin", "addressRegion": "FL", "postalCode": "32541", "addressCountry": "US"},
  "geo": {"@type": "GeoCoordinates", "latitude": 30.3864, "longitude": -86.4617},
  "numberOfRooms": 1,
  "occupancy": {"@type": "QuantitativeValue", "value": 6}
}
</script>
</head>
<body>
<!-- ═══════════════════════════════════════════════════════════════════
     LAYOUT ONLY. No copy lives in this file.
     Text   → data/site_text.js (site-wide) and data/properties.js (per property)
     Slots  → data-t="site.path" / data-t="p.path" are filled by js/site_app.js
     Blocks → data-block="name" are rendered from lists in the data files
     Names  → snake_case, object first then part. Section ids:
              hero · gallery · condo · amenities · rates · location · reviews · inquiry · faq
     Move a section: cut and paste its <section>. Order is free.
     ═══════════════════════════════════════════════════════════════════ -->

<header class="site_header">
  <div class="wrap">
    <a class="site_logo" href="index.html" data-block="site_logo"></a>
    <nav class="site_nav" id="site_nav" data-block="site_nav"></nav>
        <div class="site_switches">
      <div class="site_lang" data-block="site_prop"></div>
      <div class="site_lang" data-block="site_lang"></div>
      <label class="site_theme site_theme_head" data-block="site_theme"></label>
      <a class="site_account" data-block="site_account" href="register.html"></a>
    </div>
    <a class="btn btn_primary" id="site_cta" href="#rates" data-t="site.nav_cta"></a>
  </div>
</header>

<section class="hero" id="hero">
  <div class="wrap">
    <h1 class="hero_title"><span data-t="site.hero.title"></span> <span class="hero_title_soft" data-t="site.hero.title2"></span></h1>
    <div class="hero_grid">
      <div class="hero_text">
        <p class="hero_sub"><span data-t="site.hero.sub"></span> <strong data-t="site.hero.sub_strong"></strong></p>
        <p class="hero_sub hero_sub2" data-t="site.hero.sub2"></p>
        <div class="hero_chips" data-block="hero_chips"></div>
      </div>
      <div class="hero_photo"><img id="hero_img" data-block="hero_img" alt="" fetchpriority="high"></div>
    </div>
    <div class="hero_line" data-block="hero_line"></div>
  </div>
</section>

<section id="gallery" style="padding-top:40px">
  <div class="wrap">
    <div class="kicker" data-t="site.gallery.kicker"></div>
    <h2 class="reveal" data-t="site.gallery.title"></h2>
    <p class="lead reveal" style="margin:14px 0 24px" data-t="site.gallery.lead"></p>
    <div class="gallery_filters" id="gallery_filters"></div>
    <div class="gallery_grid reveal" id="gallery_grid"></div>
    <div style="margin-top:16px"><button class="btn btn_ghost" id="gallery_see_all" type="button"></button></div>
  </div>
</section>

<section id="condo" style="background:var(--sand)">
  <div class="wrap condo_split">
    <div class="reveal">
      <div class="kicker" data-t="site.condo.kicker"></div>
      <h2 data-t="p.headline"></h2>
      <p class="lead" style="margin-top:14px" data-t="p.subhead"></p>
      <div class="condo_desc" data-block="condo_desc"></div>
    </div>
    <div class="condo_facts reveal"><dl data-block="condo_facts"></dl></div>
  </div>
</section>

<section id="amenities">
  <div class="wrap">
    <div class="kicker" data-t="site.amenities.kicker"></div>
    <h2 class="reveal" style="margin-bottom:28px" data-t="site.amenities.title"></h2>
    <div class="amenity_groups reveal" data-block="amenity_groups"></div>
  </div>
</section>

<section id="rates" style="background:var(--sand)">
  <div class="wrap">
    <div class="kicker" data-t="site.rates.kicker"></div>
    <h2 class="reveal"><span data-t="site.rates.title_prefix"></span> <span id="rate_from">$—</span> <span data-t="site.rates.title_suffix"></span></h2>
    <div class="rates_grid" style="margin-top:20px">
      <div class="reveal rates_left">
        <div class="season_band" id="season_band"></div>
        <div class="season_months" id="season_months"></div>
        <div class="season_legend" id="season_legend"></div>
        <h3 data-t="site.rates.packages_title"></h3>
        <p class="quote_hint" data-t="site.rates.packages_hint"></p>
        <div class="package_list" id="package_list"></div>
        <p class="rate_note" id="rate_note"></p>
      </div>
      <div class="quote_card reveal" id="quote_card">
        <div class="quote_head">
          <div>
            <div class="kicker quote_kicker" data-t="site.rates.book_kicker"></div>
            <p class="quote_hint" data-t="site.rates.calendar_hint"></p>
          </div>
          <div class="quote_occupancy" data-block="quote_occupancy"></div>
        </div>
        <div class="quote_calendar" id="quote_calendar"></div>
        <div class="cal_legend"><span><i class="l_free"></i><span data-t="site.rates.legend_free"></span></span><span><i class="l_booked"></i><span data-t="site.rates.legend_booked"></span></span><span><i class="l_sel"></i><span data-t="site.rates.legend_sel"></span></span></div>
        <div class="quote_dates">
          <div><label for="quote_checkin" data-t="site.rates.check_in"></label><input type="date" id="quote_checkin"></div>
          <div><label for="quote_checkout" data-t="site.rates.check_out"></label><input type="date" id="quote_checkout"></div>
        </div>
        <div class="quote_result" id="quote_result"></div>
        <button type="button" class="btn btn_primary quote_reserve" id="quote_reserve" data-t="site.rates.reserve_cta"></button>
        <form class="reserve_panel" id="reserve_panel" hidden novalidate>
          <div><label for="reserve_name" data-t="site.reserve.name"></label><input id="reserve_name" name="name" autocomplete="given-name" required></div>
          <div><label for="reserve_last" data-t="site.reserve.last"></label><input id="reserve_last" name="last" autocomplete="family-name"></div>
          <div><label for="reserve_phone" data-t="site.reserve.phone"></label><input id="reserve_phone" name="phone" type="tel" autocomplete="tel"></div>
          <div><label for="reserve_email" data-t="site.reserve.email"></label><input id="reserve_email" name="email" type="email" autocomplete="email" required></div>
          <label class="full reserve_agree"><input type="checkbox" name="agree" required> <span data-t="site.reserve.agree"></span> <a href="terms.html" target="_blank" rel="noopener" data-t="site.reserve.agree_link"></a></label>
          <div class="full reserve_actions"><button class="btn btn_primary" type="submit" data-t="site.reserve.submit"></button><button class="btn btn_ghost" type="button" id="reserve_cancel" data-t="site.reserve.cancel"></button></div>
          <div class="full reserve_msg" id="reserve_msg"></div>
        </form>
        <div class="reserve_done" id="reserve_done" hidden></div>
      </div>
    </div>
  </div>
</section>

<section id="location">
  <div class="wrap">
    <div class="kicker" data-t="site.location.kicker"></div>
    <h2 class="reveal" style="margin-bottom:28px" data-t="site.location.title"></h2>
    <div class="location_grid">
      <div class="location_map_col reveal"><div class="location_map" id="location_map"></div><p class="location_note" data-block="location_note"></p></div>
      <div class="location_nearby reveal" id="location_nearby"></div>
    </div>
  </div>
</section>

<section id="reviews" style="background:var(--sand)">
  <div class="wrap">
    <div class="kicker" data-t="site.reviews.kicker"></div>
    <div class="review_head">
      <h2 class="reveal" data-t="site.reviews.title"></h2>
      <div class="review_nav" id="review_nav" hidden><button type="button" data-d="-1" aria-label="Previous reviews">‹</button><button type="button" data-d="1" aria-label="More reviews">›</button></div>
    </div>
    <div class="review_list reveal" id="review_list"></div>
    <div class="review_tools" id="review_tools"></div>
    <form class="review_form" id="review_form" hidden novalidate>
      <h3 data-t="site.reviews.form_title"></h3>
      <label for="review_stars" data-t="site.reviews.stars_label"></label>
      <select id="review_stars" name="stars"><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select>
      <label for="review_text" data-t="site.reviews.text_label"></label><textarea id="review_text" name="text" required></textarea>
      <label for="review_when" data-t="site.reviews.when_label"></label><input id="review_when" name="when" placeholder="July 2026">
      <div class="review_actions">
        <button class="btn btn_primary" type="submit" data-t="site.reviews.save_btn"></button>
        <button class="btn btn_ghost" type="button" id="review_cancel" data-t="site.reviews.cancel_btn"></button>
        <button class="btn btn_ghost" type="button" id="review_delete" hidden data-t="site.reviews.delete_btn"></button>
      </div>
      <div class="review_msg" id="review_msg"></div>
    </form>
  </div>
</section>

<section id="inquiry" class="contact_strip">
  <div class="wrap">
    <div class="contact_row reveal">
      <div>
        <div class="kicker" data-t="site.inquiry.kicker"></div>
        <h2 data-t="site.inquiry.title"></h2>
        <p class="lead" style="margin-top:10px" data-t="site.inquiry.lead"></p>
      </div>
      <div class="inquiry_contact">
        <a data-contact="email" href="#"></a>
        <a data-contact="phone" href="#"></a>
        <a data-contact="whatsapp" href="#"></a>
      </div>
    </div>
  </div>
</section>

<section id="faq" style="padding-top:24px">
  <div class="wrap faq_list" style="max-width:820px">
    <div class="kicker" data-t="site.faq.kicker"></div>
    <h2 class="reveal" style="margin-bottom:20px" data-t="site.faq.title"></h2>
    <div data-block="faq_list"></div>
  </div>
</section>

<footer class="site_footer" id="site_footer">
  <div class="wrap">
    <div class="footer_row">
      <a class="site_logo" href="index.html" data-block="site_logo"></a>
      <nav class="footer_links" data-block="footer_links"></nav>
      <label class="site_theme" data-block="site_theme"></label>
    </div>
    <p class="footer_tagline" data-t="site.footer.tagline"></p>
    <div class="footer_legal"><b data-t="site.footer.legal_lead"></b> <span data-t="site.footer.legal"></span> © <span id="footer_year"></span> <span data-t="site.footer.copyright"></span></div>
  </div>
</footer>

<div class="gallery_viewer" id="gallery_viewer" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <span class="count"></span>
  <button class="x" aria-label="Close">×</button>
  <button class="prev" aria-label="Previous photo">‹</button>
  <img src="" alt="">
  <div class="cap"></div>
  <button class="next" aria-label="Next photo">›</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin=""></script>
<script src="data/site_text.js?v=49"></script>
<script src="data/site_text_es.js?v=49"></script>
<script src="data/properties.js?v=49"></script>
<script src="data/properties_es.js?v=49"></script>
<script src="js/csv.js?v=49"></script>
<script src="js/site_store.js?v=49"></script>
<script src="js/site_app.js?v=49"></script>
</body>
</html>
